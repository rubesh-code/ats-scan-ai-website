name: Validate ATS Scan AI Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html ats-resume-checker.html how-it-works.html pricing.html faq.html about.html contact.html privacy-policy.html terms.html styles.css script.js robots.txt sitemap.xml assets/logo.svg assets/favicon.svg assets/og-image.png)
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

      - name: Check basic SEO tags
        shell: bash
        run: |
          set -euo pipefail
          for file in *.html; do
            grep -qi '<title>' "$file"
            grep -qi 'name="description"' "$file"
            grep -qi 'rel="canonical"' "$file"
            grep -qi '<h1' "$file"
          done
          grep -q 'https://learn.atsscanai.com/sitemap.xml' robots.txt
          grep -q 'https://learn.atsscanai.com/' sitemap.xml

      - name: Check internal linked files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  for key in ("href", "src"):
                      if key in data:
                          self.refs.append(data[key])
          root = Path(".")
          errors = []
          for page in root.glob("*.html"):
              parser = Parser()
              parser.feed(page.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  if not ref or ref.startswith(("#", "mailto:", "tel:", "data:")):
                      continue
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc:
                      continue
                  target = ref.split("#", 1)[0].split("?", 1)[0]
                  if target and not (root / target).exists():
                      errors.append(f"{page}: missing {target}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Internal file references are valid.")
          PY
