name: Validate ATS Scan AI Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website
        run: npm run validate
      - name: Build website
        run: npm run build
      - name: Confirm blog output
        run: test -f dist/blog/index.html && test -f dist/blog/how-to-improve-ats-score.html
